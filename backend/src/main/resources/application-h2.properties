# Optional H2 in-memory MariaDB-compatible profile for quick local demo without MariaDB credentials
spring.datasource.url=jdbc:h2:mem:aura_store;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
