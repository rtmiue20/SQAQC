server.port=8080

# MariaDB Configuration (can be overridden via DB_URL, DB_USERNAME, DB_PASSWORD env vars)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/aura_store?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:049206}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.jackson.serialization.write-dates-as-timestamps=false
